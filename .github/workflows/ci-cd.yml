name: 拾光电商 Agent CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的镜像发布与部署按顺序完成，避免新旧版本交错更新。
concurrency:
  group: commerce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 测试后端与前端
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEMO_MODE: 'true'
      EMBEDDING_MODE: local
      SESSION_SECRET: ci-test-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: 安装锁定的后端依赖
        working-directory: backend
        run: uv sync --frozen --no-dev --python 3.12
      - name: 运行后端测试
        working-directory: backend
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: 检查部署脚本与 SSH 参数测试
        run: |
          bash -n scripts/deploy_via_ssh.sh deploy/apply-release.sh
          python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 测试并构建前端
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: 检查 Docker Compose 配置
        run: |
          cp .env.example .env
          docker compose config --quiet

  build:
    name: 构建并推送阿里云镜像
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      backend_repository: ${{ steps.images.outputs.backend_repository }}
      frontend_repository: ${{ steps.images.outputs.frontend_repository }}
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 校验镜像仓库配置
        id: images
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
        run: |
          [[ "$REGISTRY_HOST" =~ ^[a-z0-9][a-z0-9.-]*(:[0-9]{1,5})?$ ]] || {
            echo '请在仓库 Variables 配置 REGISTRY_HOST（只填公网域名）。' >&2
            exit 1
          }
          [[ "$REGISTRY_NAMESPACE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
            echo '请在仓库 Variables 配置有效的 REGISTRY_NAMESPACE。' >&2
            exit 1
          }
          echo "backend_repository=$REGISTRY_HOST/$REGISTRY_NAMESPACE/xiaohan-commerce-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_repository=$REGISTRY_HOST/$REGISTRY_NAMESPACE/xiaohan-commerce-frontend" >> "$GITHUB_OUTPUT"
      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: 构建并推送后端镜像
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            DEBIAN_MIRROR=https://deb.debian.org
            PYPI_INDEX=https://pypi.org/simple
          tags: ${{ steps.images.outputs.backend_repository }}:${{ github.sha }}
          cache-from: type=gha,scope=commerce-backend
          cache-to: type=gha,mode=max,scope=commerce-backend
      - name: 构建并推送前端镜像
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.images.outputs.frontend_repository }}:${{ github.sha }}
          cache-from: type=gha,scope=commerce-frontend
          cache-to: type=gha,mode=max,scope=commerce-frontend
      - name: 生成固定镜像摘要的部署包
        env:
          REVISION: ${{ github.sha }}
          BACKEND_REPOSITORY: ${{ steps.images.outputs.backend_repository }}
          FRONTEND_REPOSITORY: ${{ steps.images.outputs.frontend_repository }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '后端镜像缺少摘要' >&2; exit 1; }
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '前端镜像缺少摘要' >&2; exit 1; }
          release_dir="$RUNNER_TEMP/commerce-release"
          mkdir -p "$release_dir" dist-release
          cp compose.yaml deploy/apply-release.sh "$release_dir/"
          printf '%s\n' "$REVISION" > "$release_dir/REVISION"
          printf '%s@%s\n' "$BACKEND_REPOSITORY" "$BACKEND_DIGEST" > "$release_dir/BACKEND_IMAGE"
          printf '%s@%s\n' "$FRONTEND_REPOSITORY" "$FRONTEND_DIGEST" > "$release_dir/FRONTEND_IMAGE"
          tar -C "$release_dir" -czf dist-release/commerce-release.tar.gz .
          cd dist-release
          sha256sum commerce-release.tar.gz > commerce-release.tar.gz.sha256
      - name: 保存部署包
        uses: actions/upload-artifact@v4
        with:
          name: commerce-release-${{ github.sha }}
          path: dist-release/
          compression-level: 0
          retention-days: 2
  deploy:
    name: 通过 SSH 更新 Ubuntu
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: commerce-release-${{ github.sha }}
          path: dist-release
      - name: 拉取镜像并更新服务
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/apps/xiaohan-commerce-agent' }}
          REVISION: ${{ github.sha }}
        run: bash scripts/deploy_via_ssh.sh dist-release/commerce-release.tar.gz
